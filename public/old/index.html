<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill Baby Drill</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Drill baby drill 🎓 <small style="font-size: 0.5em; opacity: 0.6; font-weight: normal;">(v1)</small></h1>
        <div style="display: flex; gap: 10px; align-items: center;">
            <a id="new-drill-btn" href="../" class="btn btn-outline" style="text-decoration: none; display: inline-flex; align-items: center;">✨ Nowy Drill</a>
            <button id="theme-toggle" class="btn btn-outline">Motyw</button>
        </div>
    </header>

    <div id="main-menu">
        <div class="card">
            <h2>Twoje Zestawy Pytań</h2>
            <div id="file-list" style="margin: 15px 0;">
                <p style="opacity: 0.6;">Wgraj plik .txt lub .json</p>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <label for="file-input" class="btn">📂 Importuj (TXT/JSON)</label>
                <input type="file" id="file-input" accept=".txt,.json">
                <button class="btn btn-outline" onclick="exportData()">💾 Eksportuj wszystko</button>
            </div>
        </div>

        <div class="card hidden" id="setup-card">
            <h2 id="selected-set-name">Wybrany: ---</h2>
            <p style="margin-bottom: 15px;">Dostępnych pytań: <span id="total-questions-count">0</span></p>
            <div class="setup-controls">
                <button class="btn" onclick="startQuiz('sequential')">▶ Wszystkie (kolejno)</button>
                <button class="btn" onclick="startQuiz('random')">🎲 Losuj:</button>
                <input type="number" id="random-count" min="1">
                <button id="btn-favorites" class="btn btn-warning" onclick="startQuiz('favorites')" disabled>
                    ⭐ Tylko ulubione (<span id="fav-count">0</span>)
                </button>
            </div>
        </div>
    </div>

    <div id="quiz-interface" class="hidden">
        <div class="card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px; opacity: 0.7;">
                <span id="progress-text">Pytanie 1/10</span>
                <span id="score-text" style="font-weight: bold;">Wynik: 0</span>
            </div>
            
            <div class="question-header">
                <div id="question-text" class="question-text">---</div>
                <button id="fav-toggle-btn" class="fav-btn">☆</button>
            </div>

            <div id="options-container" class="options-grid"></div>

            <div class="quiz-footer">
                <!-- Lewy: Wstecz -->
                <button class="btn" onclick="prevQuestion()" id="prev-btn">⬅ Wstecz</button>
                <!-- Środek: Wyjdź -->
                <button class="btn btn-danger" onclick="exitQuiz()">Wyjdź</button>
                <!-- Prawy: Akcja (Pomiń/Dalej) -->
                <button id="action-btn" class="btn">Pomiń ⏩</button>
            </div>
        </div>
    </div>

    <div id="results-screen" class="hidden">
        <div class="card">
            <h2 style="text-align: center;">Wynik końcowy</h2>
            <div id="final-score" class="result-score">0%</div>
            <p style="text-align: center; margin-bottom: 20px;" id="final-details">---</p>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button id="retry-wrong-btn" class="btn btn-warning hidden" onclick="startRetry()">🔁 Powtórz tylko błędne</button>
                <button class="btn" onclick="location.reload()">🏠 Menu główne</button>
            </div>
        </div>
    </div>

    <footer style="margin-top: 40px; padding: 20px 0; text-align: center; font-size: 0.85em; opacity: 0.7; border-top: 1px solid rgba(128, 128, 128, 0.2);">
        <p>
            Stworzone przez <a href="https://github.com/Zipeks" target="_blank" rel="noopener noreferrer" style="color: inherit; font-weight: bold; text-decoration: underline;">Mateusz Zieliński (Zipeks)</a>
            &bull;
            <a href="https://github.com/Zipeks/drill-baby-drill" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: underline;">GitHub</a>
        </p>
    </footer>
</div>

<script>
    // --- BAZA DANYCH ---
    let db = {
        files: JSON.parse(localStorage.getItem('quiz_files')) || {},
        favorites: JSON.parse(localStorage.getItem('quiz_favs')) || []
    };

    let session = {
        pool: [],
        currentIndex: 0,
        score: 0,
        wrongIndices: [],
        answers: [],       
        displayOptions: [] 
    };

    // --- PARSOWANIE ---
    function parseTxt(text) {
        // Usuwamy ewentualny nagłówek i normalizujemy końce linii
        text = text.replace(/--- START OF FILE ---/g, '');
        const lines = text.split(/\r?\n/);
        
        const questions = [];
        let currentQ = null;

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return; // Ignoruj puste linie

            // 1. Sprawdzamy czy linia to odpowiedź (format: A), >>>B), >>> B) itp.)
            // Regex: Start linii(^), wcięcia(\s*), opcjonalne >>>(>{3}), opcjonalne spacje, Litera([A-Z]), nawias(\)), reszta tekstu(.*)
            const optionMatch = line.match(/^\s*(>{3})?\s*([A-Z])\)\s*(.*)/);

            if (optionMatch) {
                // Jeśli jesteśmy w trakcie przetwarzania pytania, dodajemy opcję
                if (currentQ) {
                    currentQ.options.push({
                        text: optionMatch[3].trim(), // Treść po nawiasie
                        isCorrect: !!optionMatch[1]  // Czy znaleziono grupę '>>>'
                    });
                }
            } 
            // 2. Jeśli to nie jest odpowiedź, traktujemy to jako treść pytania
            else {
                // Decydujemy, czy to NOWE pytanie, czy kontynuacja obecnego.
                // Nowe, jeśli: zaczyna się od [#...] LUB nie ma aktywnego pytania LUB poprzednie pytanie ma już wczytane odpowiedzi
                const isNewQuestionMarker = trimmed.startsWith('[#');
                const isSequenceBreak = currentQ && currentQ.options.length > 0;

                if (isNewQuestionMarker || !currentQ || isSequenceBreak) {
                    // Zapisujemy poprzednie pytanie do bazy (jeśli istnieje i ma poprawne dane)
                    if (currentQ && currentQ.options.length > 0 && currentQ.options.some(o => o.isCorrect)) {
                        questions.push(currentQ);
                    }

                    // Przygotowanie tekstu nowego pytania
                    // Usuwamy znacznik [#123] z początku
                    let qText = trimmed.replace(/^\[#\d+\]\s*/, '');
                    // Usuwamy pogrubienie markdown (**tekst** -> tekst)
                    qText = qText.replace(/\*\*/g, '');

                    currentQ = {
                        id: qText, // Używamy treści jako ID
                        question: qText,
                        options: []
                    };
                } else {
                    // To jest kolejna linia opisu tego samego pytania (np. "inne sformułowanie: ...")
                    // Doklejamy ją, ale tylko jeśli jeszcze nie zaczęły się opcje (A, B, C...)
                    if (currentQ.options.length === 0) {
                        let extraLine = trimmed.replace(/\*\*/g, '');
                        currentQ.question += "\n" + extraLine;
                        currentQ.id = currentQ.question; // Aktualizujemy ID dla spójności
                    }
                }
            }
        });

        // Nie zapomnij zapisać ostatniego pytania z pliku
        if (currentQ && currentQ.options.length > 0 && currentQ.options.some(o => o.isCorrect)) {
            questions.push(currentQ);
        }

        return questions;
    }

    // --- PLIKI ---
    document.getElementById('file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            if (file.name.endsWith('.json')) {
                try {
                    const data = JSON.parse(content);
                    if (data.files) db.files = {...db.files, ...data.files};
                    if (data.favorites) db.favorites = [...new Set([...db.favorites, ...data.favorites])];
                    saveToDisk();
                } catch(e) { alert("Błąd pliku JSON"); }
            } else {
                const qs = parseTxt(content);
                if (qs.length) { db.files[file.name] = qs; saveToDisk(); }
            }
            renderFileList();
        };
        reader.readAsText(file);
    });

    function exportData() {
        const data = JSON.stringify(db);
        const blob = new Blob([data], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `quiz_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    function saveToDisk() {
        localStorage.setItem('quiz_files', JSON.stringify(db.files));
        localStorage.setItem('quiz_favs', JSON.stringify(db.favorites));
    }

    function renderFileList() {
        const list = document.getElementById('file-list');
        list.innerHTML = '';
        Object.keys(db.files).forEach(name => {
            const div = document.createElement('div');
            div.className = 'file-list-item';
            div.innerHTML = `<span>📄 ${name} <b>(${db.files[name].length})</b></span>
                <div><button class="btn btn-small" onclick="selectSet('${name}')">Wybierz</button>
                <button class="btn btn-danger btn-small" onclick="deleteSet('${name}')">🗑</button></div>`;
            list.appendChild(div);
        });
    }

    let currentSetName = "";
    function selectSet(name) {
        currentSetName = name;
        const qs = db.files[name];
        document.getElementById('selected-set-name').innerText = `Wybrany: ${name}`;
        document.getElementById('total-questions-count').innerText = qs.length;
        document.getElementById('setup-card').classList.remove('hidden');
        document.getElementById('random-count').value = Math.min(20, qs.length);
        updateFavCount();
    }

    function deleteSet(name) {
        if (confirm("Usunąć ten zestaw?")) { delete db.files[name]; saveToDisk(); renderFileList(); }
    }

    function updateFavCount() {
        const count = db.files[currentSetName].filter(q => db.favorites.includes(q.id)).length;
        document.getElementById('fav-count').innerText = count;
        document.getElementById('btn-favorites').disabled = count === 0;
    }

    // --- QUIZ LOGIC ---
    function startQuiz(mode) {
        let pool = [...db.files[currentSetName]];
        if (mode === 'random') {
            const count = parseInt(document.getElementById('random-count').value);
            pool = pool.sort(() => 0.5 - Math.random()).slice(0, count);
        } else if (mode === 'favorites') {
            pool = pool.filter(q => db.favorites.includes(q.id));
        }

        session = { pool, currentIndex: 0, score: 0, wrongIndices: [], answers: [], displayOptions: [] };
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('quiz-interface').classList.remove('hidden');
        renderQuestion();
    }

    function startRetry() {
        const newPool = session.wrongIndices.map(i => session.pool[i]);
        session = { pool: newPool, currentIndex: 0, score: 0, wrongIndices: [], answers: [], displayOptions: [] };
        document.getElementById('results-screen').classList.add('hidden');
        document.getElementById('quiz-interface').classList.remove('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        const q = session.pool[session.currentIndex];
        const answered = session.answers[session.currentIndex];

        document.getElementById('progress-text').innerText = `Pytanie ${session.currentIndex + 1}/${session.pool.length}`;
        document.getElementById('score-text').innerText = `Wynik: ${session.score}`;
        document.getElementById('question-text').innerText = q.question;
        
        const favBtn = document.getElementById('fav-toggle-btn');
        favBtn.innerText = db.favorites.includes(q.id) ? '★' : '☆';
        favBtn.className = 'fav-btn' + (db.favorites.includes(q.id) ? ' active' : '');
        favBtn.onclick = () => {
            if (db.favorites.includes(q.id)) db.favorites = db.favorites.filter(x => x !== q.id);
            else db.favorites.push(q.id);
            saveToDisk(); renderQuestion(); updateFavCount();
        };

        if (!session.displayOptions[session.currentIndex]) {
            session.displayOptions[session.currentIndex] = [...q.options].sort(() => 0.5 - Math.random());
        }

        const container = document.getElementById('options-container');
        container.innerHTML = '';
        session.displayOptions[session.currentIndex].forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            
            if (answered) {
                btn.disabled = true;
                if (opt.isCorrect) btn.classList.add('correct');
                if (answered.selectedText === opt.text && !opt.isCorrect) btn.classList.add('wrong');
            } else {
                btn.onclick = () => handleAnswer(opt.text, opt.isCorrect);
            }
            container.appendChild(btn);
        });

        // PRZYCISK AKCJI (PODMIANA POMIŃ NA DALEJ)
        const actionBtn = document.getElementById('action-btn');
        const isLast = session.currentIndex === session.pool.length - 1;
        
        // Reset klas (dodajemy btn-skip tylko dla pomiń)
        actionBtn.className = 'btn';

        if (!answered) {
            // Stan: Nie odpowiedziano -> Przycisk POMIŃ
            actionBtn.innerText = "Pomiń ⏩";
            actionBtn.classList.add('btn-skip');
            actionBtn.onclick = skipQuestion;
        } else {
            // Stan: Odpowiedziano -> Przycisk DALEJ
            actionBtn.innerText = isLast ? "Zakończ 🏁" : "Dalej ➡";
            actionBtn.onclick = nextQuestion;
        }

        document.getElementById('prev-btn').disabled = session.currentIndex === 0;
    }

    function handleAnswer(text, isCorrect) {
        session.answers[session.currentIndex] = { selectedText: text, isCorrect };
        if (isCorrect) session.score++;
        else session.wrongIndices.push(session.currentIndex);
        renderQuestion();
    }

    function skipQuestion() {
        if (!session.wrongIndices.includes(session.currentIndex)) {
            session.wrongIndices.push(session.currentIndex);
        }
        session.answers[session.currentIndex] = { selectedText: null, isCorrect: false, skipped: true };
        renderQuestion();
    }

    function nextQuestion() {
        if (session.currentIndex < session.pool.length - 1) {
            session.currentIndex++;
            renderQuestion();
        } else finishQuiz();
    }

    function prevQuestion() {
        if (session.currentIndex > 0) {
            session.currentIndex--;
            renderQuestion();
        }
    }

    function finishQuiz() {
        document.getElementById('quiz-interface').classList.add('hidden');
        document.getElementById('results-screen').classList.remove('hidden');
        
        const pct = Math.round((session.score / session.pool.length) * 100);
        document.getElementById('final-score').innerText = `${pct}%`;
        
        const wrongCount = session.wrongIndices.length;
        document.getElementById('final-details').innerText = 
            `Poprawne: ${session.score} / ${session.pool.length} \n (Błędy/Pominięte: ${wrongCount})`;
        
        const retryBtn = document.getElementById('retry-wrong-btn');
        retryBtn.classList.toggle('hidden', wrongCount === 0);
        if (wrongCount > 0) {
            retryBtn.innerText = `🔁 Powtórz błędne (${wrongCount})`;
        }
    }

    function exitQuiz() { if(confirm("Przerwać quiz?")) location.reload(); }

    document.getElementById('theme-toggle').onclick = () => {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
        localStorage.setItem('quiz_theme', isDark ? 'light' : 'dark');
    };
    if (localStorage.getItem('quiz_theme') === 'dark') document.body.setAttribute('data-theme', 'dark');

    renderFileList();

    const newDrillBtn = document.getElementById('new-drill-btn');
    if (newDrillBtn) {
        newDrillBtn.href = window.location.pathname.replace(/\/old(\/.*)?$/, '/');
    }
</script>
</body>
</html>
